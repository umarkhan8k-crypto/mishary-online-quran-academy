<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | International Learning Platform</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b8f6a"></head><body><div id="nav"></div><main class="page"><div class="page-title"><span class="eyebrow">Join International Learning Platform</span><h1>Create your account</h1><p>Join as a student/parent or as a tutor.</p></div><div class="form-wrap"><div class="notice">Create a demo account now. Your profile is saved on this device so you can test the student/tutor experience.</div><form id="registerForm"><div class="form-grid"><div class="field"><label>First name</label><input id="firstName" required></div><div class="field"><label>Last name</label><input id="lastName" required></div></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>I want to register as</label><select id="role"><option value="student">Student / Parent</option><option value="tutor">Quran Tutor</option></select></div><button class="btn primary full" type="submit">Create Account</button></form><p id="registerMsg" class="notice" style="display:none;margin-top:16px"></p><p style="text-align:center;font-size:13px">Already registered? <a href="login.html" style="color:var(--green)">Login</a></p></div></main><footer id="footer"></footer><script src="app.js?v=9"></script></body></html>
